[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfqa"
version = "0.5.0"
description = "Neuro-symbolic, graph-aware synthetic dataset engine that turns technical documents into verified fine-tuning data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdus Sami" }]
keywords = ["synthetic-data", "fine-tuning", "pdf", "knowledge-graph", "dpo", "rag", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "pdfminer.six>=20231228"]
parquet = ["pyarrow>=15"]
config = ["pyyaml>=6"]
solver = ["z3-solver>=4.12"]
all = ["pymupdf>=1.24", "pdfminer.six>=20231228", "pyarrow>=15", "pyyaml>=6", "z3-solver>=4.12"]
dev = ["pytest>=8", "pymupdf>=1.24", "z3-solver>=4.12"]

[project.scripts]
pdfqa = "pdfqa.cli:main"

[project.urls]
Homepage = "https://github.com/Abdus-Sami01/PDF-to-QA"
Issues = "https://github.com/Abdus-Sami01/PDF-to-QA/issues"

[tool.setuptools.packages.find]
include = ["pdfqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
